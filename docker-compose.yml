services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
      - ./public/branding:/app/public/branding:ro

volumes:
  storage:
