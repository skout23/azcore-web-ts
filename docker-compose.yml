services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-AzerothCore}
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET: ${APP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_MIN_GMLEVEL: ${ADMIN_MIN_GMLEVEL:-3}
      ADMIN_REALM_ID: ${ADMIN_REALM_ID:--1}
      DB_AUTH_HOST: ${DB_AUTH_HOST:-host.docker.internal}
      DB_AUTH_PORT: ${DB_AUTH_PORT:-3306}
      DB_AUTH_DATABASE: ${DB_AUTH_DATABASE:-acore_auth}
      DB_AUTH_USERNAME: ${DB_AUTH_USERNAME:-azweb_auth}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-}
      DB_WEB_HOST: ${DB_WEB_HOST:-host.docker.internal}
      DB_WEB_PORT: ${DB_WEB_PORT:-3306}
      DB_WEB_DATABASE: ${DB_WEB_DATABASE:-azweb}
      DB_WEB_USERNAME: ${DB_WEB_USERNAME:-azweb}
      DB_WEB_PASSWORD: ${DB_WEB_PASSWORD:-}
      DB_CHAR_HOST: ${DB_CHAR_HOST:-host.docker.internal}
      DB_CHAR_PORT: ${DB_CHAR_PORT:-3306}
      DB_CHAR_DATABASE: ${DB_CHAR_DATABASE:-acore_characters}
      DB_CHAR_USERNAME: ${DB_CHAR_USERNAME:-azweb_ro}
      DB_CHAR_PASSWORD: ${DB_CHAR_PASSWORD:-}
      DB_WORLD_DATABASE: ${DB_WORLD_DATABASE:-acore_world}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AzerothCore}
      REALM_DEFAULT_ID: ${REALM_DEFAULT_ID:-1}
      REALM_NAME: ${REALM_NAME:-AzerothCore}
      REALM_SOAP_URL: ${REALM_SOAP_URL:-}
      REALM_SOAP_USERNAME: ${REALM_SOAP_USERNAME:-}
      REALM_SOAP_PASSWORD: ${REALM_SOAP_PASSWORD:-}
      WOW_REALMLIST: ${WOW_REALMLIST:-set realmlist logon.example.com}
      WOW_CLIENT_URL: ${WOW_CLIENT_URL:-}
      WOW_RATE_XP: ${WOW_RATE_XP:-x1}
      WOW_RATE_DROP: ${WOW_RATE_DROP:-x1}
      WOW_RATE_GOLD: ${WOW_RATE_GOLD:-x1}
      WOW_RATE_REP: ${WOW_RATE_REP:-x1}
      WOW_AUCTION_SHARED: ${WOW_AUCTION_SHARED:-true}
      WOW_TOOLTIP_URL: ${WOW_TOOLTIP_URL:-https://wowgaming.altervista.org/aowow}
      WOW_REGISTRATION_ENABLED: ${WOW_REGISTRATION_ENABLED:-true}
      WOW_COMMUNITY_PUBLIC: ${WOW_COMMUNITY_PUBLIC:-false}
      WOW_UNSTUCK_ENABLED: ${WOW_UNSTUCK_ENABLED:-true}
      WOW_RENAME_ENABLED: ${WOW_RENAME_ENABLED:-true}
      WOW_CUSTOMIZE_ENABLED: ${WOW_CUSTOMIZE_ENABLED:-true}
      WOW_UNSTUCK_COOLDOWN: ${WOW_UNSTUCK_COOLDOWN:-PT3H}
      WOW_RENAME_COOLDOWN: ${WOW_RENAME_COOLDOWN:-P1Y}
      WOW_CUSTOMIZE_COOLDOWN: ${WOW_CUSTOMIZE_COOLDOWN:-calendar_quarter}
      SITE_LOGO: ${SITE_LOGO:-}
      SITE_FAVICON: ${SITE_FAVICON:-}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
      - ./public/branding:/app/public/branding:ro

volumes:
  storage:
